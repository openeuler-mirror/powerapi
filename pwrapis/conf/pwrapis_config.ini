[log]
# MB
file_size=10
cmp_cnt=3
# 0-debug 1-info 2-warning 3-error
log_level=1
log_path=/var/log/pwrapis
bak_log_path=/var/log/pwrapis/bak
log_pfx=papis.log

[server]
sock_file=/etc/sysconfig/pwrapis/pwrserver.sock
#[gather]

# Rule 1:The client can only use Minuscule, numbers and underscores.
#        Other special characters are not allowed
[client]
# An admin could observe and config the system
# multiple admins are separated by comma
admin=root
# An observer could observe the system
observer=

[watch]
# Optional: extra comma-separated file paths for the eBPF writer attribution
# to watch, on top of the built-in prefixes (/sys/devices/system/cpu/cpufreq/,
# /sys/kernel/hbm_cache/, /sys/devices/system/container/,
# /sys/firmware/efi/efivars/). The key keeps its historical
# "drift_watch_files" name for config compatibility.
drift_watch_files=

[bpf_writer]
# 1=enable 0=disable. eBPF writer attribution: records who made a bypass
# write to the watched sysfs/efivars paths. Requires root and a
# BPF-capable kernel; on failure it logs a warning and stays inert
# (best-effort, like the rest of the audit layer).
bpf_writer_enable=1
# Directory holding the compiled BPF objects, one per CPU architecture
# (bpf_writer_x86.bpf.o / bpf_writer_arm64.bpf.o); the loader picks the right
# one at runtime. A concrete *.o file path can be set to override.
bpf_writer_obj=/usr/lib/pwrapis